<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expense & Budget Visualizer</title>
  <link rel="stylesheet" href="css/style.css" />
  <!-- Chart.js CDN untuk visualisasi Pie Chart -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <div class="container">
    <!-- Header & Dark/Light Mode Toggle (Optional Challenge 1) -->
    <header class="app-header">
      <h1>Expense & Budget Visualizer</h1>
      <button type="button" id="themeToggle" class="theme-btn" aria-label="Toggle Dark/Light Mode">
        🌙 Dark Mode
      </button>
    </header>

    <!-- Total Balance Card -->
    <section class="card balance-card">
      <span class="balance-label">TOTAL BALANCE</span>
      <h2 id="totalBalance" class="balance-amount">$0.00</h2>
    </section>

    <!-- Add Transaction Form Card -->
    <section class="card form-card">
      <h3>Add Transaction</h3>
      <form id="transactionForm" novalidate>
        <div class="form-group">
          <label for="itemName">Item Name</label>
          <input
            type="text"
            id="itemName"
            placeholder="e.g., Cilok, Coffee, Bus Ticket"
            required
          />
        </div>

        <div class="form-group">
          <label for="itemAmount">Amount ($)</label>
          <input
            type="number"
            id="itemAmount"
            placeholder="0.00"
            step="0.01"
            min="0.01"
            required
          />
        </div>

        <div class="form-group">
          <label for="itemCategory">Category</label>
          <select id="itemCategory" required></select>
        </div>

        <!-- Custom Category Feature (Optional Challenge 2) -->
        <div class="custom-category-box">
          <input
            type="text"
            id="customCategoryInput"
            placeholder="Add new category (e.g., Bills)..."
          />
          <button type="button" id="addCategoryBtn" class="secondary-btn">
            + Category
          </button>
        </div>

        <p id="formError" class="error-message" role="alert"></p>

        <button type="submit" class="primary-btn">Add Transaction</button>
      </form>
    </section>

    <!-- Bottom Grid: Transactions List & Pie Chart -->
    <div class="bottom-grid">
      <!-- Transactions Card -->
      <section class="card transactions-card">
        <div class="card-header-row">
          <h3>Transactions</h3>
          <!-- Sort Feature (Optional Challenge 3) -->
          <select id="sortSelect" class="sort-select" aria-label="Sort transactions">
            <option value="latest">Sort: Latest</option>
            <option value="amount-desc">Amount: High to Low</option>
            <option value="amount-asc">Amount: Low to High</option>
            <option value="category">Category: A - Z</option>
            <option value="name">Item Name: A - Z</option>
          </select>
        </div>

        <ul id="transactionList" class="transaction-list">
          <!-- Item transaksi akan dirender di sini oleh JavaScript -->
        </ul>
      </section>

      <!-- Visual Chart Card -->
      <section class="card chart-card">
        <h3>Spending by Category</h3>
        <div class="chart-wrapper">
          <canvas id="spendingChart"></canvas>
          <p id="emptyChartText" class="empty-text">
            Add transactions to see your spending distribution.
          </p>
        </div>
      </section>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
